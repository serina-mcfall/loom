# Phase 1 of the PR gate: the deterministic checks only.
#
# No API key, no secrets, no LLM, no per-run cost. Everything here either passes
# or fails for a reason a human can reproduce locally with one command.
#
# Why this exists before any Claude review: a green status check that GitHub's
# branch protection can require, without needing an approving human review.
# Required approving reviews deadlock a solo repository — the author cannot
# approve their own PR — and the escape used previously was a commit status,
# which has no UI at all. A workflow run has one.
#
# Phase 2 (a Claude review behind a label trigger) is deliberately NOT here.
# See research/claude-pr-review-automation.md in serina-learning for why: auth
# and cost were settled first, and one open question about subscription auth in
# CI is still unresolved.

name: checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A newer push to the same branch makes the older run irrelevant. Cancel it
# rather than paying for a verdict on superseded code.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests and constraints
    runs-on: ubuntu-latest
    # A hung job otherwise burns minutes until the 6-hour default. Nothing here
    # legitimately takes more than a minute.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No install step, and that is the point: if this workflow ever needs
      # `pip install`, the zero-dependency constraint has already been broken.
      - name: Confirm the interpreter
        run: python3 --version

      - name: Every import is stdlib or first-party
        run: python3 scripts/check_stdlib_only.py

      - name: Test suite
        run: python3 -m unittest discover -s tests -v

      # The suite includes a test asserting the server binds 127.0.0.1 and never
      # 0.0.0.0. This step is a second, independent guard on the same constraint,
      # because it is the one failure in this project that would be invisible in
      # normal use and unrecoverable if shipped: it reads the source directly
      # rather than trusting the test to still exist.
      - name: No server binds to all interfaces
        run: |
          if grep -rn '0\.0\.0\.0' loom/ loom_cli.py bin/ 2>/dev/null; then
            echo "FAIL: a bind address of 0.0.0.0 appears in the source." >&2
            echo "Loom serves git history, PR data and session state. It must" >&2
            echo "never be reachable off this machine." >&2
            exit 1
          fi
          echo "OK: no 0.0.0.0 in loom/, loom_cli.py or bin/"

      # A smoke test that exercises the real collection path end to end, in an
      # environment where `gh` is present but NOT authenticated. That is hard to
      # arrange locally and it is exactly the degradation this project cares
      # about: the gh sources must come back `ok: false` with a reason, while the
      # snapshot as a whole stays valid and the git sources stay `ok: true`.
      #
      # Note what is deliberately NOT asserted: that gh succeeds. Asserting that
      # would fail here for the right reason and teach us to weaken the check.
      - name: Collect a real snapshot, and degrade honestly without gh auth
        run: |
          chmod +x bin/loom
          # Written outside the working tree on purpose: a snapshot dropped in the
          # repo root would dirty it, and Loom reports dirty counts about itself.
          ./bin/loom snapshot --json > "${RUNNER_TEMP:-/tmp}/snapshot.json"
          python3 - <<'PY'
          import json, os, sys

          snap = json.load(open(os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"),
                                             "snapshot.json")))
          assert snap["schema"] == 1, f"schema is {snap['schema']!r}, expected 1"
          assert snap["repos"], "no repos in snapshot — collection found nothing at all"

          repo = snap["repos"][0]
          sources = {s["name"]: s for s in repo["sources"]}
          print("sources:")
          for name, s in sorted(sources.items()):
              print(f"  {name:22} ok={s['ok']!s:5} {s.get('error') or ''}")

          # `git` (the worktree list) must work: it is the one source with no
          # external dependency at all.
          #
          # `git:default-branch` is deliberately NOT required to succeed. In a
          # fresh clone or a CI checkout `origin/HEAD` is often unresolvable, and
          # the source correctly reports ok=false with that reason rather than
          # guessing silently. Requiring it here would fail the build for correct
          # behaviour — which is how a check gets weakened until it means nothing.
          assert "git" in sources, f"no `git` source present, only: {sorted(sources)}"
          assert sources["git"]["ok"], f"the git worktree source failed: {sources['git']}"

          # Every source must state ok either way — a source that reports
          # neither success nor a reason is the failure mode this project
          # exists to refuse.
          for name, s in sources.items():
              assert isinstance(s["ok"], bool), f"{name}: ok is not a bool"
              if not s["ok"]:
                  assert s.get("error"), f"{name}: not ok, but gave no reason"

          degraded = sorted(n for n, s in sources.items() if not s["ok"])
          print(f"\nOK: schema 1, {len(snap['repos'])} repo(s), "
                f"git worktree source healthy, "
                f"{len(degraded)} source(s) degraded with a stated reason"
                + (f": {', '.join(degraded)}" if degraded else ""))
          PY

  # --------------------------------------------------------------- the types
  # A SEPARATE JOB ON PURPOSE, and this is the whole reason it is separate.
  #
  # `tests and constraints` has no install step, and that is its guarantee: if it
  # ever needs `pip install`, the zero-dependency constraint has been broken. A
  # type checker is a DEVELOPMENT dependency, not a runtime one, so it must not be
  # allowed to weaken that signal. Putting mypy in its own job keeps both true --
  # the tests job still proves Loom runs on a bare interpreter, and the code still
  # gets checked.
  #
  # WHY THIS EARNED ITS PLACE: run for the first time during the 2026-08-05 audit
  # remediation, mypy immediately found `body` being used for both `str` and `bytes`
  # in one function, where an f-string would silently have emitted "b'...'" if
  # anything were reordered. It also found the `last_good` field that had been
  # declared and never assigned since v1. Audit finding M5.
  #
  # --allow-any-generics, not full --strict: bare `dict` is used idiomatically
  # throughout this codebase and annotating 39 of them buys nothing. Everything
  # else --strict checks is on, because those are the checks that find defects.
  types:
    name: types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned. An unpinned checker turns somebody else's release into a red build
      # on a branch that changed nothing.
      - name: Install mypy
        run: python3 -m pip install --quiet mypy==2.3.0

      - name: Type check
        run: mypy --strict --allow-any-generics loom/ loom_cli.py hooks/ scripts/

  # ---------------------------------------------------------------- the gate
  # Separate job on purpose. `tests and constraints` answers "is the code sound?"
  # This answers "did a human-run review vouch for THIS commit?" — a different
  # question, and it should be possible to see at a glance which one failed.
  #
  # WHAT THIS CHECK CAN AND CANNOT PROVE
  #
  # It proves a READY verdict was recorded for this exact commit. It does NOT
  # prove the review was any good — the verdict is a recorded judgement, and no
  # workflow can re-derive judgement. Its value is narrower and still real:
  # a review that never happened, or happened against earlier code, cannot
  # satisfy it, and any new push invalidates it automatically.
  #
  # This is the half a local hook cannot do. `pr-gate.sh` stops the agent; it
  # cannot see a merge performed in a browser. A required status check can.
  # To make it binding, mark `verdict` as a required check in the ruleset for
  # `main` — until then this reports and does not enforce.
  verdict:
    name: reviewed for this commit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The step below diffs the reviewed commit against the
          # head, and checkout is shallow (depth 1) by default — the diff would
          # fail for lack of history, which looks identical to the gate working.
          fetch-depth: 0

      - name: A READY verdict exists for the head commit
        env:
          # THE TRAP THIS AVOIDS: on a pull_request event, `github.sha` is the
          # ephemeral MERGE commit GitHub creates, not the commit the author has
          # checked out. verdict.sh records the author's HEAD. Comparing against
          # github.sha would fail every single time, for a reason that looks like
          # the gate working. Always the PR head.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          path = ".superpowers/verdict.json"
          want = os.environ["HEAD_SHA"]

          def block(msg):
              # THE REMEDIATION MUST NAME SOMETHING THAT EXISTS.
              #
              # This used to say `.claude/skills/review-final/verdict.sh`, a path
              # that does not exist in this repository -- `.claude/` holds one
              # gitignored stamp file. A contributor hitting this gate followed the
              # instructions to a missing script, and a gate whose escape hatch is
              # undocumented is a gate people work around. Audit 2026-08-05, M6.
              #
              # No path is named now, deliberately: the script ships inside the
              # serina-skills plugin, whose cache directory is VERSION-specific
              # (serina/0.6.0/skills/review-final/verdict.sh today, something else
              # after the next update). Any literal path here would rot. The skill
              # knows where its own script lives, so the instruction is to invoke
              # the skill.
              print(f"BLOCKED  {msg}")
              print()
              print("This branch has no review recorded for its current state.")
              print("  1. Run the review-final skill (serina:review-final).")
              print("  2. Ask it to record the verdict:  verdict.sh record ready")
              print("     -- it re-runs the objective checks and REFUSES to write")
              print("        READY if they fail, so a claim cannot outrun the tests.")
              print("  3. Commit .superpowers/verdict.json and push.")
              print()
              print("verdict.sh ships with the skill, not with this repo.")
              sys.exit(1)

          # Absence blocks. A review killed by turn exhaustion writes nothing, and
          # nothing must never read as approval.
          if not os.path.exists(path):
              block(f"no {path} in this branch.")

          try:
              v = json.load(open(path))
          except Exception as exc:
              block(f"{path} is not readable JSON ({exc}).")

          state, sha = v.get("state"), v.get("sha")

          if state != "READY":
              reason = v.get("reason")
              block(f"verdict state is {state!r}" + (f": {reason}" if reason else ""))

          # THE CHICKEN-AND-EGG, and why an exact match alone cannot work.
          #
          # verdict.sh stamps the sha of the commit it reviewed. Committing the
          # verdict file then creates a NEW head — so an exact-match rule can
          # never be satisfied by anyone, ever. The first green run is impossible.
          #
          # The fix is not to loosen the comparison but to make it precise: the
          # head may differ from the reviewed sha ONLY if the sole change between
          # them is the verdict file itself. Any other file touched after the
          # review means the review does not cover the code, and it blocks.
          if sha != want:
              import subprocess
              try:
                  changed = subprocess.run(
                      ["git", "diff", "--name-only", f"{sha}..{want}"],
                      capture_output=True, text=True, timeout=30,
                  )
              except Exception as exc:
                  block(f"could not diff {str(sha)[:8]}..{want[:8]} ({exc}).")

              if changed.returncode != 0:
                  # An unknown sha lands here. Refusing is correct: a verdict
                  # naming a commit this branch does not contain proves nothing.
                  block(
                      f"verdict names {str(sha)[:8]}, which is not reachable from "
                      f"this PR's head {want[:8]}.\n"
                      f"         git said: {changed.stderr.strip()[:120]}"
                  )

              files = [f for f in changed.stdout.split("\n") if f.strip()]
              if files != [".superpowers/verdict.json"]:
                  block(
                      f"verdict is for {str(sha)[:8]} but head is {want[:8]}, and "
                      f"{len(files)} file(s) changed since:\n"
                      + "\n".join(f"           {f}" for f in files[:10])
                      + "\n         The review does not cover this code."
                  )
              print(f"OPEN  verdict is for {str(sha)[:8]}; the only change since is "
                    "the verdict file itself")
          else:
              print(f"OPEN  READY verdict matches head {want[:8]}")
          print(f"      recorded {v.get('recorded_at', 'at an unstated time')}"
                f" against plan {v.get('plan', '(unnamed)')}")
          checks = v.get("checks") or {}
          if checks:
              print(f"      checks at record time: {checks}")
          PY
