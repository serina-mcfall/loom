<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loom</title>
<link rel="stylesheet" href="/static/loom.css">
</head>
<body>
<header class="bar">
  <h1>Loom</h1>
  <!-- Not a live region: rewritten every tick, and it carries the badge detail
       ("collected 3s ago") so #conn itself can stay quiet. -->
  <p id="summary" class="summary">connecting…</p>
  <!-- role="status" is an implicit polite live region, so this is written ONLY
       when the state word actually changes. It used to be reassigned on every
       SSE message, i.e. every 2 seconds, which queues an endless announcement
       and makes the page unusable with a screen reader. Audit finding M7. -->
  <p id="conn" class="conn" role="status">●&nbsp;connecting</p>
</header>

<!-- A repo named in ~/.loom/repos that does not exist. Hidden unless it happens, so a
     healthy config shows nothing. role="alert" because a board missing a repo the
     operator asked for is worth interrupting for -- unlike the 2-second data badge,
     this changes only when the config file changes. -->
<p id="config-warning" class="config-warning" role="alert" hidden></p>

<main>
  <!-- ONE strip for the whole fleet, deliberately. With `--all` there may be
       several repos, and N independent polite live regions is how a screen
       reader becomes unusable. loom.view.aggregate_needs labels each item with
       its repo when there is more than one. Audit finding H5. -->
  <section aria-labelledby="needs-h" class="panel panel--needs">
    <h2 id="needs-h">Needs you</h2>
    <!-- The VISIBLE list is deliberately NOT a live region. It re-renders every 2
         seconds for the eye, and a live region firing that often makes a screen
         reader unusable. The debounce used to be implemented by flipping this
         element's aria-live between "off" and "polite" on every render, which
         readers do not reliably honour -- they register live regions on entry to the
         accessibility tree. Audit finding M8. -->
    <ul id="needs"></ul>
    <!-- Permanently polite, never toggled, and updated at most every 15 seconds with
         one short sentence from loom.view.announcement. This is what a screen reader
         actually hears. -->
    <p id="needs-announce" class="visually-hidden" role="status" aria-live="polite"></p>
  </section>

  <!-- One <section> per repo, built by loom.js. The skeleton is rebuilt only
       when the set of repo names changes, so focus inside a scroll container
       survives the 2-second refresh. -->
  <div id="repos"></div>
</main>
<script src="/static/loom.js"></script>
</body>
</html>
